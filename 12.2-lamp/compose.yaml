# ~/stacks/lamp/compose.yaml (VPS) - P12 punto 12.2
# Construye la imagen LAMP propia y la deja detras de NPM (lamp.macki4all.es).
services:
  lamp:
    build: .
    image: p12/lamp:1.0
    container_name: lamp
    restart: unless-stopped
    env_file: .env            # DB_PASS (no se entrega; ver .env.ejemplo)
    expose:
      - "80"
    volumes:
      - lamp-db:/var/lib/mysql
    networks:
      - proxy

volumes:
  lamp-db:

networks:
  proxy:
    external: true
